<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="TechRecruit AI — Plataforma de recrutamento inteligente.">
<title>TechRecruit AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#13131a;--surface2:#1a1a24;--border:#2a2a3a;
  --accent:#6c63ff;--accent2:#a78bfa;--text:#e2e2f0;--muted:#6b6b8a;
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 70% at 15% 10%,#6c63ff18 0%,transparent 55%),
    radial-gradient(ellipse 60% 55% at 85% 90%,#a78bfa12 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 50% 50%,#6c63ff08 0%,transparent 60%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,#2a2a3a 1px,transparent 1px);
  background-size:36px 36px;opacity:.22;
}

/* ── HEADER ── */
.hdr{
  position:fixed;top:0;left:0;right:0;z-index:10;height:64px;
  display:flex;align-items:center;padding:0 32px;gap:12px;
  background:rgba(10,10,15,.7);backdrop-filter:blur(16px);border-bottom:1px solid rgba(108,99,255,.14);
}
.hdr-logo-img{height:32px;width:32px;object-fit:contain;border-radius:8px;display:none}
.hdr-icon{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 14px #6c63ff44;
}
.hdr-icon svg{width:16px;height:16px;fill:#fff}
.hdr-name{font-size:15px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* ── HERO ── */
.hero{
  position:relative;z-index:1;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:80px 24px 48px;
}

.hero-tag{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 16px;border-radius:20px;margin-bottom:28px;
  background:rgba(108,99,255,.12);border:1px solid rgba(108,99,255,.28);
  font-size:12px;font-weight:600;color:var(--accent2);
  animation:fadeInUp .5s ease both;
}
.hero-tag .dot{width:7px;height:7px;border-radius:50%;background:#10b981;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.75)}}

.hero h1{
  font-size:clamp(2.4rem,6vw,4rem);font-weight:900;line-height:1.08;
  letter-spacing:-.04em;margin-bottom:18px;
  animation:fadeInUp .5s .1s ease both;
}
.grad{background:linear-gradient(135deg,var(--accent),var(--accent2),#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.hero-sub{
  font-size:clamp(15px,2vw,18px);color:var(--muted);max-width:480px;line-height:1.65;
  margin-bottom:52px;
  animation:fadeInUp .5s .2s ease both;
}

/* ── BUTTONS ── */
.btns{
  display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
  animation:fadeInUp .5s .3s ease both;
}

.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:16px 32px;border-radius:14px;font-size:16px;font-weight:700;
  font-family:inherit;cursor:pointer;text-decoration:none;
  transition:opacity .2s,transform .15s,box-shadow .2s;
  letter-spacing:-.01em;
}
.btn:active{transform:scale(.97)}

.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;
  box-shadow:0 6px 28px rgba(108,99,255,.4);
}
.btn-primary:hover{opacity:.88;box-shadow:0 8px 36px rgba(108,99,255,.55)}

.btn-ghost{
  background:rgba(255,255,255,.04);color:var(--text);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(8px);
}
.btn-ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(108,99,255,.4);color:var(--accent2)}

.btn svg{width:18px;height:18px;flex-shrink:0}

/* ── BOTTOM INFO ── */
.powered{
  position:fixed;bottom:24px;left:0;right:0;text-align:center;z-index:1;
  font-size:12px;color:var(--muted);animation:fadeInUp .5s .5s ease both;
}
.powered a{color:var(--muted);text-decoration:none;transition:color .2s}
.powered a:hover{color:var(--accent2)}

@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<header class="hdr">
  <img class="hdr-logo-img" id="hdr-logo-img" src="" alt="">
  <div class="hdr-icon" id="hdr-icon">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  </div>
  <span class="hdr-name" id="hdr-name">TechRecruit AI</span>
</header>

<main class="hero">
  <div class="hero-tag">
    <span class="dot"></span>
    Plataforma de Recrutamento Inteligente
  </div>

  <h1 id="hero-title">Conectando<br><span class="grad">talentos</span> ao futuro</h1>
  <p class="hero-sub" id="hero-sub">Candidate-se a vagas em segundos ou acesse o painel administrativo para gerenciar seu processo seletivo.</p>

  <div class="btns">
    <a href="/vagas" class="btn btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      🔍 Ver Vagas Abertas
    </a>
    <a href="/login" class="btn btn-ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      🔐 Área Administrativa
    </a>
  </div>
</main>

<div class="powered">Powered by <a href="#">TechRecruit AI</a></div>

<script>
(async function carregarMarca() {
  try {
    const res  = await fetch('https://webhook.danns.com.br/webhook/ats-marca', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'get' })
    });
    if (!res.ok) return;
    const data = await res.json();
    const m    = data.marca;
    if (!m) return;
    const nome = m.nome_empresa || 'TechRecruit AI';
    document.getElementById('hdr-name').textContent  = nome;
    document.title = nome;
    if (m.slogan) {
      document.getElementById('hero-sub').textContent = m.slogan;
    }
    if (m.logo_base64) {
      const img  = document.getElementById('hdr-logo-img');
      const icon = document.getElementById('hdr-icon');
      img.src = m.logo_base64; img.style.display = 'block'; icon.style.display = 'none';
    }
    const r = document.documentElement.style;
    if (m.cor_primaria)   r.setProperty('--accent',  m.cor_primaria);
    if (m.cor_secundaria) r.setProperty('--accent2', m.cor_secundaria);
  } catch {}
})();
</script>
</body>
</html>

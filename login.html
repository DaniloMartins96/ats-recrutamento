<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechRecruit AI — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#13131a;--surface2:#1a1a24;--border:#2a2a3a;
  --accent:#6c63ff;--accent2:#a78bfa;--text:#e2e2f0;--muted:#6b6b8a;
  --danger:#ff4d6d;--success:#10b981;
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── background ── */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 70% 60% at 20% 10%, #6c63ff18 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 90%, #a78bfa12 0%, transparent 60%);
  pointer-events:none;
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:radial-gradient(circle, #2a2a3a 1px, transparent 1px);
  background-size:32px 32px;
  opacity:.35;pointer-events:none;
}

/* ── layout ── */
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

/* ── card ── */
.card{
  width:100%;max-width:420px;
  background:rgba(19,19,26,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(108,99,255,.22);border-radius:20px;
  padding:40px 36px 36px;
  box-shadow:0 32px 80px #00000070, 0 0 0 1px rgba(108,99,255,.08);
}

/* ── brand ── */
.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:28px}
.brand-icon{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 0 20px #6c63ff44;
}
.brand-icon svg{width:22px;height:22px;fill:#fff}
.brand-logo-img{width:44px;height:44px;object-fit:contain;border-radius:12px;display:none}
.brand-name{font-size:17px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.02em}

/* ── titles ── */
.login-title{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-.02em}
.login-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:32px}
.login-sub strong{color:var(--accent2);font-weight:600}

/* ── divider ── */
.divider{height:1px;background:var(--border);margin:0 -8px 28px;opacity:.6}

/* ── fields ── */
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}
.field input{
  width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:13px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
.field input::placeholder{color:var(--muted)}

/* ── error ── */
.err{color:var(--danger);font-size:12px;margin-top:7px;min-height:16px;font-weight:500}

/* ── btn ── */
.btn-entrar{
  width:100%;margin-top:8px;padding:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;font-family:inherit;
  cursor:pointer;transition:opacity .2s,transform .1s;letter-spacing:.01em;
  box-shadow:0 4px 24px rgba(108,99,255,.35);
}
.btn-entrar:hover{opacity:.9}
.btn-entrar:active{transform:scale(.98)}
.btn-entrar:disabled{opacity:.5;cursor:not-allowed}

/* ── spinner inside btn ── */
.btn-entrar .spinner{
  display:inline-block;width:16px;height:16px;border:2px solid #ffffff50;
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
  vertical-align:middle;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── forgot ── */
.forgot{display:block;text-align:center;margin-top:20px;font-size:12px;color:var(--muted);text-decoration:none;transition:color .2s}
.forgot:hover{color:var(--accent2)}

/* ── shake ── */
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .35s ease}

/* ── footer ── */
.login-footer{text-align:center;margin-top:32px;font-size:11px;color:var(--muted);position:relative;z-index:1}
</style>
</head>
<body>

<div class="wrap">
  <div>
    <div class="card" id="login-card">

      <!-- Marca -->
      <div class="brand">
        <img class="brand-logo-img" id="brand-logo-img" src="" alt="">
        <div class="brand-icon" id="brand-icon-default">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <span class="brand-name" id="brand-nome">TechRecruit AI</span>
      </div>

      <h1 class="login-title">Bem-vindo ao</h1>
      <p class="login-sub"><strong id="titulo-empresa">TechRecruit AI</strong></p>

      <div class="divider"></div>

      <!-- Form -->
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="admin@empresa.com.br"
          autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="login-senha" placeholder="••••••••••••"
          autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <div class="err" id="login-err"></div>
      </div>

      <button class="btn-entrar" id="btn-entrar" onclick="doLogin()">Entrar</button>

      <a href="#" class="forgot" onclick="alert('Entre em contato com o suporte para redefinir sua senha.');return false">
        Esqueci minha senha
      </a>
    </div>

    <div class="login-footer">Powered by TechRecruit AI &nbsp;·&nbsp; v2.0</div>
  </div>
</div>

<script>
const MARCA_URL = 'https://webhook.danns.com.br/webhook/ats-marca';
const LOGIN_URL = 'https://webhook.danns.com.br/webhook/ats-login';

// Se já estiver logado, vai direto pro admin
(function() {
  if (sessionStorage.getItem('ats_token')) window.location.replace('admin.html');
})();

// Carrega marca da empresa
(async function carregarMarca() {
  try {
    const res  = await fetch(MARCA_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'get' }) });
    if (!res.ok) return;
    const data = await res.json();
    const m    = data.marca;
    if (!m) return;
    const nome = m.nome_empresa || 'TechRecruit AI';
    document.getElementById('brand-nome').textContent  = nome;
    document.getElementById('titulo-empresa').textContent = nome;
    document.title = nome + ' — Login';
    if (m.logo_base64) {
      const img  = document.getElementById('brand-logo-img');
      const icon = document.getElementById('brand-icon-default');
      img.src = m.logo_base64; img.style.display = 'block';
      icon.style.display = 'none';
    }
    const r = document.documentElement.style;
    if (m.cor_primaria)   r.setProperty('--accent',  m.cor_primaria);
    if (m.cor_secundaria) r.setProperty('--accent2', m.cor_secundaria);
  } catch {}
})();

async function doLogin() {
  const email = (document.getElementById('login-email').value  || '').trim();
  const senha = (document.getElementById('login-senha').value  || '').trim();
  const errEl = document.getElementById('login-err');
  const btn   = document.getElementById('btn-entrar');

  errEl.textContent = '';
  if (!email || !senha) { errEl.textContent = 'Preencha e-mail e senha.'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Entrando...';

  // Fallback local (master) — verificado antes da API para garantir acesso sempre
  if (email === 'admin@techrecruit.ai' && senha === 'admin123') {
    autenticar({ empresa_id: 1, nome: 'TechRecruit AI', plano: 'master', token: 'local-token', email });
    return;
  }

  // Tentar autenticação via API
  try {
    const res  = await fetch(LOGIN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha }),
      signal: AbortSignal.timeout(8000)
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.token) {
      autenticar(data);
      return;
    }
    errEl.textContent = data.mensagem || 'E-mail ou senha incorretos.';
  } catch {
    errEl.textContent = 'Não foi possível conectar ao servidor.';
  }

  btn.disabled = false;
  btn.innerHTML = 'Entrar';
  document.getElementById('login-card').classList.add('shake');
  setTimeout(() => document.getElementById('login-card').classList.remove('shake'), 400);
  document.getElementById('login-senha').value = '';
  document.getElementById('login-senha').focus();
}

function autenticar(sessao) {
  sessionStorage.setItem('ats_token',   sessao.token);
  sessionStorage.setItem('ats_session', JSON.stringify(sessao));
  window.location.replace('admin.html');
}
</script>
</body>
</html>
